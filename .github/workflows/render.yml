name: Render videos

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sirf ek script render karni ho to naam likho (jaise example). Khali = sab"
        required: false
        default: ""
      fps:
        description: "FPS agar script me na likha ho (30 normal, 60 extra smooth)"
        required: false
        default: "30"
  push:
    paths:
      - "scripts/**"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, glob
          allf = sorted(glob.glob("scripts/*.txt"))
          sel = allf
          if os.environ["EVENT"] == "workflow_dispatch":
              only = os.environ.get("ONLY", "").strip()
              if only:
                  sel = [f for f in allf if os.path.basename(f)[:-4] == only]
          else:
              try:
                  out = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM",
                                                 os.environ["BEFORE"], "HEAD", "--", "scripts"], text=True).split("\n")
                  sel = [f for f in out if f.endswith(".txt") and os.path.exists(f)]
              except Exception:
                  sel = allf
          names = [os.path.basename(f)[:-4] for f in sel]
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("matrix=" + json.dumps(names) + "\n")
              o.write("count=" + str(len(names)) + "\n")
          print("Render hone wali scripts:", names)
          PY

  video:
    needs: list
    if: needs.list.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/video.yml
    with:
      script: ${{ matrix.script }}
      fps: ${{ inputs.fps || '30' }}

  publish:
    needs: video
    if: ${{ !cancelled() && needs.video.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: videos
          pattern: video-*
          merge-multiple: true

      - name: Upload to GitHub Release & Save Link
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: "v-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          ls videos/*.mp4 >/dev/null 2>&1 || { echo "Koi video nahi bani"; exit 1; }
          echo "GitHub Release me video daal rahe hain..."
          gh release create "$TAG_NAME" videos/*.mp4 --repo "$GITHUB_REPOSITORY" --title "Rendered Videos $TAG_NAME" --notes "Auto-generated by 4-AI Cinematic Studio"

          : > new_links.txt
          for vid in videos/*.mp4; do
            f=$(basename "$vid"); id="${f%.mp4}"
            echo "$id,https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$f" >> new_links.txt
            echo "Link: $id"
          done

          # do video ek saath bani hon to dono ka push takra sakta hai -> fresh copy par dobara koshish
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            touch links.txt
            cat new_links.txt >> links.txt
            git add links.txt
            git commit -q -m "Added GitHub Release video link" || true
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then echo "links.txt update ho gaya"; exit 0; fi
            echo "push takraya, dobara koshish $i"; sleep $(( (RANDOM % 8) + 3 ))
          done
          echo "links.txt push nahi ho paaya (video Release me hai)"; exit 1
